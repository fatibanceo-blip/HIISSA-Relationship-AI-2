name: A5.2 Staging connection diagnostic (manual only)

on:
  push:
    branches:
      - feature/admin-permissions-package-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-connection-check:
    if: github.ref == 'refs/heads/feature/admin-permissions-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the approved Package A branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify branch and diagnostic file
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/admin-permissions-package-a"
          test -f scripts/a5_2_staging_connection_check.mjs
      - name: Run existing read-only Staging diagnostic
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://upcssfmilewwshyxyvdf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HIISSA_A52_STAGING_PUBLISHABLE_KEY }}
        run: node scripts/a5_2_staging_connection_check.mjs
