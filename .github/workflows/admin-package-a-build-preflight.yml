name: Package A build preflight (Staging branch)

on:
  push:
    branches:
      - feature/admin-permissions-package-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preflight:
    if: github.ref == 'refs/heads/feature/admin-permissions-package-a'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated Package A branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch-scoped deployment configuration
        run: node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const c=JSON.parse(fs.readFileSync('vercel.json','utf8')); assert.equal(c.git.deploymentEnabled['feature/admin-permissions-package-a'],true)"
      - name: Install dependencies without deployment
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Next.js build with nonfunctional test-only credential
        env:
          OPENAI_API_KEY: sk-test-placeholder-not-a-real-key
          NEXT_PUBLIC_SUPABASE_URL: https://upcssfmilewwshyxyvdf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TEST_PLACEHOLDER_NOT_A_REAL_KEY
        run: npm run build
